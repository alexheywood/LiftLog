<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>LiftLog — Offline Workout Tracker</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e9effb;background:#0b1220;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:0 0 85px}header{position:sticky;top:0;z-index:3;background:#101827;border-bottom:1px solid #29374b;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}h2{font-size:20px;margin:4px 0 14px}h3{font-size:16px;margin:0 0 8px}.muted,small{color:#a7b5c9}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#172338;border:1px solid #30405a;border-radius:15px;padding:16px;margin-bottom:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;background:#2e415d;color:#fff;padding:11px 13px;font-weight:650}button.primary{background:#65d5b2;color:#082a23}button.danger{background:#753945}button.ghost{background:transparent;border:1px solid #40516b}button:disabled{opacity:.45}input,select{background:#0c1728;border:1px solid #465875;color:#fff;border-radius:9px;padding:11px;width:100%;min-width:0}label{display:block;font-size:12px;color:#b8c6d9;margin:0 0 5px}.field{min-width:0}.field input{font-variant-numeric:tabular-nums}nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#111b2c;border-top:1px solid #33445b;display:flex;justify-content:space-around;padding:8px 4px max(8px,env(safe-area-inset-bottom))}nav button{background:transparent;color:#aebed3;font-size:12px;padding:9px 7px}nav button.active{color:#69e0bd;background:#223a40}.pill{display:inline-block;background:#264b45;color:#8de8ca;padding:5px 9px;border-radius:100px;font-size:12px}.warn{background:#594523;color:#ffe3a2}.sethead,.setrow{display:grid;grid-template-columns:40px 1fr 1fr 38px;gap:9px;align-items:center;margin-top:9px}.sethead{color:#9eafc6;font-size:12px}.setrow input{text-align:center;padding:10px 3px}.setrow input[type=checkbox]{width:21px;height:21px;accent-color:#65d5b2;justify-self:center}.exercise{border-top:1px solid #35445b;padding-top:15px;margin-top:15px}canvas{width:100%;height:230px;display:block}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.note{font-size:13px;line-height:1.5;color:#b9c7d8}.hidden{display:none}.big{font-size:29px;font-weight:750}.spaced{margin-top:12px}#toast{position:fixed;bottom:77px;left:50%;transform:translateX(-50%);background:#b1f5dc;color:#082a23;padding:12px 18px;border-radius:12px;display:none;z-index:10;max-width:90%;text-align:center}@media(min-width:650px){.wrap{padding:24px}.gridWide{display:grid;grid-template-columns:1fr 1fr;gap:14px}}@media(max-width:360px){.wrap{padding:10px}.card{padding:12px}.row{gap:6px}button{padding:9px 8px}}
</style></head><body><header><h1>LiftLog <span style="color:#65d5b2">●</span></h1><small>Offline • saved on this device</small></header><main class="wrap" id="app"></main><nav id="nav"><button data-tab="workout">Workout</button><button data-tab="progress">Progress</button><button data-tab="weight">Body weight</button><button data-tab="settings">Exercises & data</button></nav><div id="toast" role="status"></div><script>
(()=>{'use strict';
const KEY='liftlog-v1';const defaults={A:[['Barbell squat',40,2.5],['Bench press',40,2.5],['Lat pulldown',30,2.5],['Romanian deadlift',30,2.5],['Dumbbell bicep curl',7.5,1],['Tricep pushdown',20,2.5]],B:[['Leg press',60,5],['Incline dumbbell press',12.5,1],['Seated cable row',30,2.5],['Shoulder press',10,1],['Tricep pushdown',20,2.5],['Dumbbell hammer curl',7.5,1]]};
const id=()=>globalThis.crypto?.randomUUID?.()||('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
const init=()=>({version:2,next:'A',exercises:Object.fromEntries(Object.entries(defaults).map(([k,v])=>[k,v.map(([name,target,increment])=>({id:id(),name,target,increment}))])),sessions:[],weights:[],draft:null});
let data;try{data=JSON.parse(localStorage.getItem(KEY));if(!data||!data.exercises||!Array.isArray(data.sessions)||!Array.isArray(data.weights))throw Error('Invalid')}catch{data=init()}
// Upgrade existing locally saved plans without deleting workout history or weigh-ins.
// Only add the missing arm exercise once; do not modify an active draft.
if((data.version||1)<2){
  for(const [type,name,target,increment] of [['A','Tricep pushdown',20,2.5],['B','Dumbbell hammer curl',7.5,1]]){
    if(Array.isArray(data.exercises[type])&&!data.exercises[type].some(e=>e.name.toLowerCase()===name.toLowerCase())){
      data.exercises[type].push({id:id(),name,target,increment});
    }
  }
  data.version=2;
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}
}
let tab='workout',chartMode='weight',chartExercise='',chartRange='all';const app=document.getElementById('app');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{alert('Could not save locally. Storage may be full or disabled. Export a backup.');return false}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Number.isFinite(+v)?+v:0;const fmt=v=>Number(v).toLocaleString('en-GB',{maximumFractionDigits:2});const date=v=>new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});const today=()=>new Date().toLocaleDateString('en-CA');
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2800)}
function last(exId){for(let i=data.sessions.length-1;i>=0;i--){let e=data.sessions[i].exercises.find(x=>x.id===exId);if(e)return e}return null}
function start(){if(data.draft)return;data.draft={id:id(),type:data.next,started:new Date().toISOString(),exercises:data.exercises[data.next].map(e=>{let p=last(e.id);return{id:e.id,name:e.name,sets:[0,1,2].map((_,i)=>({weight:e.target,reps:p?.sets[i]?.reps||8,done:false}))}})};save()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));app.innerHTML=tab==='workout'?workout():tab==='progress'?progress():tab==='weight'?bodyWeight():settings();if(tab==='progress')requestAnimationFrame(draw)}
function workout(){const d=data.draft;let html=`<h2>${d?'Workout '+esc(d.type)+' in progress':'Next: Workout '+esc(data.next)}</h2>`;if(!d){html+=`<div class="card"><div class="big">Workout ${esc(data.next)}</div><p class="note">3 sets of 8–12 reps per exercise. Hit 12 on all three completed sets at the target weight to increase next time.</p><button class="primary" data-action="start" style="width:100%">Start workout ${esc(data.next)}</button></div><div class="card"><h3>Planned exercises</h3>${data.exercises[data.next].map(e=>`<p>${esc(e.name)} <span class="muted">· ${fmt(e.target)} kg × 3</span></p>`).join('')}</div>`}else{html+=`<div class="card"><div class="row"><span class="pill">Workout ${esc(d.type)}</span><small>Started ${date(d.started)}</small></div>${d.exercises.map((e,idx)=>{let previous=last(e.id);return`<section class="exercise"><div class="row"><h3>${esc(e.name)}</h3><span class="pill">${fmt(data.exercises[d.type].find(x=>x.id===e.id)?.target??e.sets[0].weight)} kg target</span></div><div class="note">${previous?'Last: '+previous.sets.map(s=>`${fmt(s.weight)}kg × ${s.reps}`).join(' / '):'First time logging this exercise'}</div><div class="sethead"><span>Set</span><span>Weight (kg)</span><span>Reps</span><span>Done</span></div>${e.sets.map((s,j)=>`<div class="setrow"><b>${j+1}</b><input aria-label="${esc(e.name)} set ${j+1} weight" type="number" inputmode="decimal" min="0" step="0.5" data-edit="weight" data-e="${idx}" data-s="${j}" value="${esc(s.weight)}"><input aria-label="${esc(e.name)} set ${j+1} reps" type="number" inputmode="numeric" min="0" max="100" step="1" data-edit="reps" data-e="${idx}" data-s="${j}" value="${esc(s.reps)}"><input aria-label="${esc(e.name)} set ${j+1} completed" type="checkbox" data-edit="done" data-e="${idx}" data-s="${j}" ${s.done?'checked':''}></div>`).join('')}</section>`}).join('')}<div class="actions spaced"><button class="primary" data-action="finish">Finish & save</button><button class="danger" data-action="discard">Discard</button></div><p class="note">Only checked sets count as completed. Finishing saves your session and calculates the next targets.</p></div>`}
html+=`<div class="card"><h3>Recent workouts</h3>${data.sessions.length?data.sessions.slice(-5).reverse().map(s=>`<div class="row spaced"><span>Workout ${esc(s.type)} · ${date(s.finished)}</span><button class="ghost" data-action="session-detail" data-id="${esc(s.id)}">View</button></div>`).join(''):'<p class="note">No workouts saved yet.</p>'}</div>`;return html}
function progress(){let exercises=[...data.exercises.A,...data.exercises.B];if(!chartExercise||!exercises.some(x=>x.id===chartExercise))chartExercise=exercises[0]?.id||'';return`<h2>Progress</h2><div class="card"><div class="grid"><div class="field"><label>Metric</label><select id="chartMode"><option value="weight" ${chartMode==='weight'?'selected':''}>Working weight</option><option value="volume" ${chartMode==='volume'?'selected':''}>Session volume</option><option value="reps" ${chartMode==='reps'?'selected':''}>Total completed reps</option></select></div><div class="field"><label>Time range</label><select id="chartRange"><option value="all">All time</option><option value="30" ${chartRange==='30'?'selected':''}>30 days</option><option value="90" ${chartRange==='90'?'selected':''}>90 days</option></select></div></div><div class="field spaced"><label>Exercise</label><select id="chartExercise">${exercises.map(e=>`<option value="${esc(e.id)}" ${e.id===chartExercise?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><canvas id="strengthChart" role="img" aria-label="Exercise progress chart"></canvas><div id="chartSummary" class="note"></div></div><div class="card"><h3>Body-weight trend</h3><canvas id="miniWeight" role="img" aria-label="Body weight chart"></canvas></div>`}
function bodyWeight(){let latest=[...data.weights].sort((a,b)=>b.date.localeCompare(a.date))[0];return`<h2>Body weight</h2><div class="card"><div class="muted">Latest weigh-in</div><div class="big">${latest?fmt(latest.kg)+' kg':'—'}</div><form id="weightForm" class="spaced"><div class="grid"><div class="field"><label>Date</label><input name="date" type="date" required value="${today()}"></div><div class="field"><label>Body weight (kg)</label><input name="kg" type="number" inputmode="decimal" min="1" max="500" step="0.1" required placeholder="e.g. 76.5"></div></div><button class="primary spaced" type="submit" style="width:100%">Save weigh-in</button></form></div><div class="card"><h3>Weight history</h3><canvas id="bodyChart" role="img" aria-label="Body weight history chart"></canvas><p class="note">Daily changes are normal. Focus on the longer-term trend.</p></div><div class="card"><h3>Entries</h3>${[...data.weights].sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<div class="row spaced"><span>${esc(w.date)} — <b>${fmt(w.kg)} kg</b></span><button class="ghost" data-action="delete-weight" data-id="${esc(w.id)}">Delete</button></div>`).join('')||'<p class="note">No weigh-ins yet.</p>'}</div>`}
function settings(){return`<h2>Exercises & backup</h2><p class="note">Change your starting/next target and the increase applied after 3 × 12. Exercise targets are updated automatically after a successful workout.</p>${['A','B'].map(t=>`<div class="card"><h3>Workout ${t}</h3>${data.exercises[t].map(e=>`<div class="exercise"><div class="field"><label>Exercise name</label><input data-ex-field="name" data-type="${t}" data-id="${esc(e.id)}" value="${esc(e.name)}"></div><div class="grid spaced"><div class="field"><label>Next weight (kg)</label><input type="number" inputmode="decimal" min="0" step="0.5" data-ex-field="target" data-type="${t}" data-id="${esc(e.id)}" value="${e.target}"></div><div class="field"><label>Increase (kg)</label><input type="number" inputmode="decimal" min="0.1" step="0.1" data-ex-field="increment" data-type="${t}" data-id="${esc(e.id)}" value="${e.increment}"></div></div><button class="danger spaced" data-action="delete-exercise" data-type="${t}" data-id="${esc(e.id)}">Remove exercise</button></div>`).join('')}<button class="primary spaced" data-action="add-exercise" data-type="${t}">+ Add exercise to ${t}</button></div>`).join('')}<div class="card"><h3>Data & backups</h3><p class="note">Everything stays in this browser's localStorage. Export regularly, especially before clearing browser data or changing phones. Imports replace all existing data.</p><div class="actions"><button class="primary" data-action="export">Export JSON</button><button data-action="import">Import JSON</button></div><input type="file" id="importFile" accept="application/json,.json" hidden><div class="actions spaced"><button class="danger" data-action="reset">Delete all data</button></div></div>`}
function plot(canvas,points,unit){if(!canvas)return;let rect=canvas.getBoundingClientRect(),w=Math.max(250,rect.width),h=230,ratio=window.devicePixelRatio||1;canvas.width=w*ratio;canvas.height=h*ratio;let c=canvas.getContext('2d');c.scale(ratio,ratio);c.clearRect(0,0,w,h);c.font='12px system-ui';if(!points.length){c.fillStyle='#b9c7d8';c.textAlign='center';c.fillText('No data yet — log a session to see progress',w/2,h/2);return}let values=points.map(p=>p.y),lo=Math.min(...values),hi=Math.max(...values),pad=Math.max((hi-lo)*.18,unit==='kg'?.5:1);lo-=pad;hi+=pad;let L=48,R=w-12,T=15,B=h-30;for(let i=0;i<=4;i++){let y=T+(B-T)*i/4;c.strokeStyle='#314158';c.beginPath();c.moveTo(L,y);c.lineTo(R,y);c.stroke();c.fillStyle='#b3c2d7';c.textAlign='right';c.fillText(fmt(hi-(hi-lo)*i/4),L-7,y+4)}let xs=points.map(p=>new Date(p.date+'T12:00:00').getTime());let x0=Math.min(...xs),x1=Math.max(...xs);let px=i=>x0===x1?(L+R)/2:L+(xs[i]-x0)/(x1-x0)*(R-L);let py=y=>B-(y-lo)/(hi-lo)*(B-T);c.strokeStyle='#6de0bc';c.lineWidth=2.5;c.beginPath();points.forEach((p,i)=>i?c.lineTo(px(i),py(p.y)):c.moveTo(px(i),py(p.y)));c.stroke();points.forEach((p,i)=>{c.fillStyle='#6de0bc';c.beginPath();c.arc(px(i),py(p.y),3.5,0,Math.PI*2);c.fill()});c.fillStyle='#b3c2d7';c.textAlign='left';c.fillText(date(points[0].date),L,B+19);c.textAlign='right';c.fillText(date(points.at(-1).date),R,B+19)}
function draw(){let ex=chartExercise,pts=data.sessions.map(s=>{let e=s.exercises.find(x=>x.id===ex);if(!e)return null;let sets=e.sets.filter(x=>x.done);if(!sets.length)return null;let y=chartMode==='weight'?Math.max(...sets.map(x=>n(x.weight))):chartMode==='volume'?sets.reduce((a,x)=>a+n(x.weight)*n(x.reps),0):sets.reduce((a,x)=>a+n(x.reps),0);return{date:s.finished.slice(0,10),y}}).filter(Boolean);if(chartRange!=='all')pts=pts.filter(p=>new Date(p.date+'T12:00:00').getTime()>=Date.now()-Number(chartRange)*864e5);plot(document.getElementById('strengthChart'),pts,chartMode==='weight'?'kg':'');let summary=document.getElementById('chartSummary');if(summary)summary.textContent=pts.length?`${pts.length} logged sessions • first ${fmt(pts[0].y)} → latest ${fmt(pts.at(-1).y)}${chartMode==='weight'?' kg':''}`:'Log completed sets to populate this graph.';plot(document.getElementById('miniWeight'),weightPoints(),'kg')}
function weightPoints(){return [...data.weights].sort((a,b)=>a.date.localeCompare(b.date)).map(w=>({date:w.date,y:w.kg}))}
function finish(){let d=data.draft;if(!d)return;let completed=d.exercises.flatMap(e=>e.sets).filter(s=>s.done);if(!completed.length)return alert('Check at least one completed set first.');let gains=[];d.exercises.forEach(e=>{let cfg=data.exercises[d.type].find(x=>x.id===e.id);if(!cfg)return;let success=e.sets.length===3&&e.sets.every(s=>s.done&&n(s.reps)>=12&&Math.abs(n(s.weight)-n(cfg.target))<.001);if(success){cfg.target=Math.round((n(cfg.target)+n(cfg.increment))*100)/100;gains.push(`${cfg.name}: ${fmt(cfg.target)} kg`)}});data.sessions.push({...d,finished:new Date().toISOString()});data.draft=null;data.next=d.type==='A'?'B':'A';save();render();toast(gains.length?'New targets: '+gains.join(', '):'Workout saved!')}
function validateImport(v){if(!v||v.version!==1||!['A','B'].includes(v.next)||!v.exercises||!Array.isArray(v.exercises.A)||!Array.isArray(v.exercises.B)||!Array.isArray(v.sessions)||!Array.isArray(v.weights)||v.sessions.length>100000||v.weights.length>100000)throw Error('Invalid LiftLog backup');for(let t of ['A','B'])for(let e of v.exercises[t])if(typeof e.id!=='string'||typeof e.name!=='string'||!Number.isFinite(e.target)||!Number.isFinite(e.increment)||e.increment<=0)throw Error('Invalid exercise');for(let s of v.sessions){if(!Array.isArray(s.exercises)||!['A','B'].includes(s.type)||typeof s.finished!=='string')throw Error('Invalid session');for(let e of s.exercises)if(!Array.isArray(e.sets)||e.sets.some(z=>!Number.isFinite(z.weight)||!Number.isFinite(z.reps)))throw Error('Invalid sets')}for(let w of v.weights)if(typeof w.date!=='string'||!Number.isFinite(w.kg)||w.kg<=0)throw Error('Invalid weight');return v}
app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,t=b.dataset.type,ex=b.dataset.id;switch(a){case'start':start();render();break;case'finish':finish();break;case'discard':if(confirm('Discard the current workout?')){data.draft=null;save();render()}break;case'add-exercise':{let name=prompt('Exercise name');if(!name?.trim())break;data.exercises[t].push({id:id(),name:name.trim(),target:10,increment:2.5});save();render();break}case'delete-exercise':if(data.draft){alert('Finish or discard your active workout before editing exercises.');break}if(confirm('Remove this exercise? Existing history will remain in backups.')){data.exercises[t]=data.exercises[t].filter(x=>x.id!==ex);save();render()}break;case'delete-weight':if(confirm('Delete this weigh-in?')){data.weights=data.weights.filter(x=>x.id!==ex);save();render()}break;case'session-detail':{let s=data.sessions.find(x=>x.id===ex);if(s)alert(`Workout ${s.type} — ${date(s.finished)}\n\n`+s.exercises.map(x=>x.name+'\n'+x.sets.map(y=>`${y.done?'✓':'–'} ${fmt(y.weight)}kg × ${y.reps}`).join(' / ')).join('\n\n'));break}case'export':{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`liftlog-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Backup downloaded');break}case'import':document.getElementById('importFile').click();break;case'reset':if(confirm('Permanently delete ALL workout and weight data on this device?')&&confirm('Are you absolutely sure? Export a backup first.')){data=init();save();render()}break}});
app.addEventListener('change',e=>{let el=e.target;if(el.dataset.edit){let s=data.draft?.exercises[+el.dataset.e]?.sets[+el.dataset.s];if(!s)return;if(el.dataset.edit==='done')s.done=el.checked;else{let val=+el.value;if(!Number.isFinite(val)||val<0||(el.dataset.edit==='reps'&&(!Number.isInteger(val)||val>100))){alert('Enter a valid non-negative value');render();return}s[el.dataset.edit]=val}save()}else if(el.dataset.exField){if(data.draft){alert('Finish or discard the active workout before changing exercise settings.');render();return}let ex=data.exercises[el.dataset.type]?.find(x=>x.id===el.dataset.id);if(!ex)return;let v=el.dataset.exField==='name'?el.value.trim():+el.value;if((typeof v==='string'&&!v)||(typeof v==='number'&&(!Number.isFinite(v)||v<0||(el.dataset.exField==='increment'&&v<=0)))){alert('Invalid value');render();return}ex[el.dataset.exField]=v;save();toast('Exercise saved')}else if(el.id==='chartMode'){chartMode=el.value;draw()}else if(el.id==='chartExercise'){chartExercise=el.value;draw()}else if(el.id==='chartRange'){chartRange=el.value;draw()}else if(el.id==='importFile'){let f=el.files?.[0];if(!f)return;if(f.size>20*1024*1024)return alert('Backup file is too large');f.text().then(s=>{let v=validateImport(JSON.parse(s));if(confirm('Replace ALL local data with this backup?')){data=v;save();render();toast('Backup imported')}}).catch(err=>alert('Import failed: '+err.message))}});
app.addEventListener('submit',e=>{if(e.target.id!=='weightForm')return;e.preventDefault();let form=new FormData(e.target),kg=+form.get('kg'),dt=form.get('date');if(!Number.isFinite(kg)||kg<=0||kg>500||!/^\d{4}-\d{2}-\d{2}$/.test(dt))return alert('Enter a valid date and weight.');let old=data.weights.find(x=>x.date===dt);if(old){if(!confirm('Replace the existing weigh-in for this date?'))return;old.kg=kg}else data.weights.push({id:id(),date:dt,kg});save();render();toast('Weigh-in saved')});
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();if(tab==='weight')requestAnimationFrame(()=>plot(document.getElementById('bodyChart'),weightPoints(),'kg'))}});window.addEventListener('resize',()=>{if(tab==='progress')draw();if(tab==='weight')plot(document.getElementById('bodyChart'),weightPoints(),'kg')});render();})();
</script></body></html>
